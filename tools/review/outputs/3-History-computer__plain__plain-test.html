产生并非依赖于符号和逻辑规则，而是源于大脑中成千上万个神经元的联结和计算。正如其支持者所言，“高级的智能行为是从大量神经网络的连接中自发出现的”。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  \n<\/article>\n<article class=\"pair-card is-unchanged\" id=\"line-314\" data-status=\"unchanged\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-unchanged\">未变化<\/span>\n      <strong>pair-0114<\/strong>\n      <span class=\"meta\">paragraph · L314-L317<\/span>\n    <\/div>\n    <div class=\"section-title\">联结学派/连接学派(Connectionism)：从神经网络到深度学习<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>联结主义学派主张通过模仿大脑神经元网络的工作原理来实现智能。大脑由一万亿个神经元细胞通过错综复杂的相互连接形成了复杂的认知和决策能力。\n特别关注如何通过数据训练来自动调整网络参数，使系统能够在数据中自发学习和优化。\n其核心思路是模仿神经元的工作方式，构建多层网络结构，调整神经元之间的连接权重，使得系统逐渐具备特定的识别和判断能力。\n例如，神经网络的训练过程就是通过不断调整权重，逐步优化输出结果的过程。不同于符号主义学派的知识驱动，联结主义的这一训练机制强调{\\bf 数据驱动的学习}，即依靠大量的数据输入，使系统在学习中自动调整网络参数，以形成稳定的模式识别和分类能力。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>联结主义学派主张通过模仿大脑神经元网络的工作原理来实现智能。大脑由一万亿个神经元细胞通过错综复杂的相互连接形成了复杂的认知和决策能力。\n特别关注如何通过数据训练来自动调整网络参数，使系统能够在数据中自发学习和优化。\n其核心思路是模仿神经元的工作方式，构建多层网络结构，调整神经元之间的连接权重，使得系统逐渐具备特定的识别和判断能力。\n例如，神经网络的训练过程就是通过不断调整权重，逐步优化输出结果的过程。不同于符号主义学派的知识驱动，联结主义的这一训练机制强调{\\bf 数据驱动的学习}，即依靠大量的数据输入，使系统在学习中自动调整网络参数，以形成稳定的模式识别和分类能力。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  \n<\/article>\n<article class=\"pair-card is-unchanged\" id=\"line-319\" data-status=\"unchanged\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-unchanged\">未变化<\/span>\n      <strong>pair-0115<\/strong>\n      <span class=\"meta\">paragraph · L319<\/span>\n    <\/div>\n    <div class=\"section-title\">联结学派/连接学派(Connectionism)：从神经网络到深度学习<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>联结主义学派的重要进展包括从早期的{\\bf 感知机模型}到更复 >\n<article class=\"pair-card is-unchanged\" id=\"line-367\" data-status=\"unchanged\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-unchanged\">未变化<\/span>\n      <strong>pair-0134<\/strong>\n      <span class=\"meta\">paragraph · L367<\/span>\n    <\/div>\n    <div class=\"section-title\">三大学派对比总结<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>人工智能的发展经历了显著的转型：从依赖人工规则的符号主义学派，到借助经验和反馈的联结主义与行为主义学派，AI的核心方法从“推理期”和“知识期”逐渐过渡到“学习期”。这种变化反映了AI在应对复杂问题时，从自上而下的规则构建转向自下而上的经验学习。符号主义学派强调人工设计规则和知识库来解决问题，而联结主义学派和行为主义学派则更关注如何通过数据驱动的方式从经验中学习知识。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>人工智能的发展经历了显著的转型：从依赖人工规则的符号主义学派，到借助经验和反馈的联结主义与行为主义学派，AI的核心方法从“推理期”和“知识期”逐渐过渡到“学习期”。这种变化反映了AI在应对复杂问题时，从自上而下的规则构建转向自下而上的经验学习。符号主义学派强调人工设计规则和知识库来解决问题，而联结主义学派和行为主义学派则更关注如何通过数据驱动的方式从经验中学习知识。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  \n<\/article>\n<article class=\"pair-card is-unchanged\" id=\"line-369\" data-status=\"unchanged\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-unchanged\">未变化<\/span>\n      <strong>pair-0135<\/strong>\n      <span class=\"meta\">paragraph · L369-L370<\/span>\n    <\/div>\n    <div class=\"section-title\">三大学派对比总结<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>人工智能发展过程中，{\\bf 符号主义学派}、{\\bf 联结主义学派}和{\\bf 行为主义学派}分别从不同角度探索智能的本质。每一学派都有其独特的理论基础、代表方法和应用领域，也各有特色。\n符号学派主要关注智能的逻辑和推理过程，模拟智能软件的工作方式；联结学派则通过模仿大脑神经元结构，试图在“硬件”层面上还原智能；而行为学派则基于简单生物体与环境互动的模式，从动态环境中找寻适应性智能。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>人工智能发展过程中，{\\bf 符号主义学派}、{\\bf 联结主义学派}和{\\bf 行为主义学派}分别从不同角度探索智能的本质。每一学派都有其独特的理论基础、代表方法和应用 (function () {

      <div><strong>${escapeHtml(name)}</strong><span>${escapeHtml(detail || "")}</span></div>`;

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function readFrameDocument() {
    try {
      return frame.contentDocument || frame.contentWindow.document;
    } catch (error) {
      return null;
    }
  }

  function visibleCards(doc) {
    return Array.from(doc.querySelectorAll("[data-status]")).filter((card) => {
      return !card.classList.contains("is-hidden");
    });
  }

  function countStatuses(cards) {
    return cards.reduce((acc, card) => {
      const status = card.dataset.status || "unknown";
      acc[status] = (acc[status] || 0) + 1;
      return acc;
    }, {});
  }

  function click(doc, selector) {
    const node = doc.querySelector(selector);
    if (!node) {
      return false;
    }
    node.click();
    return true;
  }

  function waitForFrame() {
    return new Promise((resolve) => {
      const doc = readFrameDocument();
      if (doc && doc.readyState === "complete") {
        window.setTimeout(resolve, 30);
        return;
      }
      frame.addEventListener("load", () => window.setTimeout(resolve, 30), { once: true });
      window.setTimeout(resolve, 1500);
    });
  }

    checks.push(mark("新增数量", (counts.added || 0) === expectedCounts.added, `${counts.added || 0} / ${expectedCounts.added}`));
    checks.push(mark("删除数量", (counts.removed || 0) === expectedCounts.removed, `${counts.removed || 0} / ${expectedCounts.removed}`));
    checks.push(mark("未变化数量", (counts.unchanged || 0) === expectedCounts.unchanged, `${counts.unchanged || 0} / ${expectedCounts.unchanged}`));

    const filterButtons = Array.from(doc.querySelectorAll("[data-filter-status]")).map((button) => button.dataset.filterStatus).join(",");
    checks.push(mark("筛选按钮", filterButtons === "all,changed,added,removed,unchanged", filterButtons || "未找到"));

    const navLinks = Array.from(doc.querySelectorAll(".nav-link"));
    const navTargetsValid = navLinks.every((link) => !!doc.querySelector(link.getAttribute("href") || ""));
    checks.push(mark("章节导航", navLinks.length === expected.navCount && navTargetsValid, `${navLinks.length} 个锚点`));

    checks.push(mark("外部脚本", doc.querySelectorAll("script[src]").length === 0, `${doc.querySelectorAll("script[src]").length} 个外部脚本`));

    for (const status of ["changed", "added", "removed", "unchanged", "all"]) {
      click(doc, `[data-filter-status="${status}"]`);
      const visible = visibleCards(doc).length;
      const expectedVisible = status === "all" ? expected.pairCount : expectedCounts[status];
      checks.push(mark(`筛选：${status}`, visible === expectedVisible, `${visible} / ${expectedVisible}`));
    }

    if ((expectedCounts.changed || 0) > 0) {
      click(doc, '[data-filter-status="changed"]');
      const visible = visibleCards(doc);
      click(doc, '[data-diff-action="expand"]');
      const details = visible.flatMap((card) => Array.from(card.querySelectorAll("details.diff-detail")));
      const opened = details.filter((detail) => detail.open).length;
      click(doc, '[data-diff-action="collapse"]');
      const closed = details.filter((detail) => !detail.open).length;
      checks.push(mark("展开差异", opened === details.length && details.length > 0, `${opened} / ${details.length}`));
      checks.push(mark("收起差异", closed === details.length && details.length > 0, `${closed} / ${details.length}`));
    }

    frame.classList.remove("is-mobile");
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const desktopOverflow = doc.documentElement.scrollWidth > frame.clientWidth + 2;
    checks.push(mark("桌面宽度", !desktopOverflow, desktopOverflow ? "出现横向溢出" : "无横向溢出"));

    frame.classList.add("is-mobile");
    await new Promise((resolve) => requestAnimationFrame(resolve));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const grid = doc.querySelector(".compare-grid");
    const gridDisplay = grid ? frame.contentWindow.getComputedStyle(grid).display : "";
    const mobileOverflow = doc.documentElement.scrollWidth > frame.clientWidth + 2;
    checks.push(mark("移动宽度", gridDisplay === "block" && !mobileOverflow, `布局：${gridDisplay || "未知"}`));

    const passed = checks.filter(Boolean).length;
    const failed = checks.length - passed;
    summary.className = failed === 0 ? "summary-line is-ok" : "summary-line is-bad";
    summary.textContent = failed === 0 ? `通过 ${passed} 项` : `通过 ${passed} 项，失败 ${failed} 项`;
  }

  function loadPreview() {
    frame.addEventListener("load", runTests, { once: true });
    if (embeddedReviewHtml && "srcdoc" in frame) {
      frame.srcdoc = embeddedReviewHtml;
      return;
    }
    const doc = readFrameDocument();
    if (doc && doc.readyState === "complete") {
      runTests();
    }
  }

  runButton.addEventListener("click", runTests);
  sizeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      frame.classList.toggle("is-mobile", button.dataset.frameSize === "mobile");
    });
  });
  loadPreview();
})();

  </script>
</body>
</html>
