r-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0027<\/strong>\n      <span class=\"meta\">paragraph · L63<\/span>\n    <\/div>\n    <div class=\"section-title\">计算机的诞生：从算盘到电子计算机<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>计算工具的发展历程体现了人类对智能机械化的不懈追求。17世纪，帕斯卡发明了第一台机械计算器——帕斯卡计算器，能够进行简单的加减运算。这台机器虽然功能有限，但它体现了一个重要思想：人类的某些智能活动（如计算）可以通过机械装置来实现。莱布尼茨进一步改进了这一设计，发明了能够进行乘除运算的步进计算器，并提出了二进制计算的概念。19世纪，查尔斯·巴贝奇设计了分析机（Analytical Engine），这是第一台具有现代计算机基本特征的机械装置。分析机包含了存储器（磨坊）、运算器（工厂）和控制器等基本组件，能够根据程序执行复杂的计算任务。更重要地，巴贝奇的合作者阿达·洛夫莱斯在为分析机编写程序时，提出了机器可能具有创造性思维的设想，这可能是AI思想的最早表述之一。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">计算工具的发展历程体现了人类对智能机械化的不懈追求。17世纪，帕斯卡发明了第一台机械计算器——帕斯卡计算器，能够进行简单的加减运算。这台机器虽然功能有限，但它体现了一个重要思想：人类的某些智能活动（如计算）可以通过机械装置来实现。莱布尼茨进一步改进了这一设计，发明了能够进行乘除运算的步进计算器，并提出了二进制计算的概念。19世纪，查尔斯·巴贝奇设计了分析机（Analytical Engine），这是第一台具有现代计算机基本特征的机械装置。分析机包含了存储器（磨坊）、运算器（工厂）和控制器等基本组件，能够根据程序执行复杂的计算任务。更重要地，巴贝奇的合作者阿达·洛夫莱斯在为分析机编写程序时，提出了机器可能具有创造性思维的设想，这可能是AI思想的最早表述之一。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-65\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0028<\/strong>\n      <span class=\"meta\">paragraph · L65<\/span>\n    <\/div>\n    <div class=\"section-title\">计算机的诞生：从算盘到电子计算机<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>电子技术的突破为AI的实现提供了真正的技术基础。20世纪40年代，电子技术的发展使得真正的电子计算机成为可能。1946年，ENIAC（电子数值积分计算机）在美国宾夕法尼亚大学诞生，标志着电子计算机时代的开始。这台重达30吨的庞然大物，虽然体积庞大、功耗巨大，但其计算速度远超机械计算器，为复杂的数值计算提供了可能。ENIAC的意义不仅在于其强大的计算能力，更在于它的可编程特性。通过重新连接电缆和设置开关，ENIAC能够执行不同的任务，这为后来的通用计算机奠定了基础。这种灵活性使得同一台机器能够处理不同类型的问题，这正是实现通用人工智能所需要的基本特征。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">电子技术的突破为AI的实现提供了真正的技术基础。20世纪40年代，电子技术的发展使得真正的电子计算机成为可能。1946年，ENIAC（电子数值积分计算机）在美国宾夕法尼亚大学诞生，标志着电子计算机时代的开始。这台重达30吨的庞然大物，虽然体积庞大、功耗巨大，但其计算速度远超机械计算器，为复杂的数值计算提供了可能。ENIAC的意义不仅在于其强大的计算能力，更在于它的可编程特性。通过重新连接电缆和设置开关，ENIAC能够执行不同的任务，这为后来的通用计算机奠定了基础。这种灵活性使得同一台机器能够处理不同类型的问题，这正是实现通用人工智能所需要的基本特征。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-67\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0029<\/strong>\n      <span class=\"meta\">paragraph · L67<\/span>\n    <\/div>\n    <div class=\"section-title\">计算机的诞生：从算盘到电子计算机<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>冯·诺依曼架构的确立为智能系统的发展奠定了理论基础。1945年，约翰·冯·诺依曼在《关于EDVAC的报告草案》中提出了存储程序计算机的概念，即程序和数据都存储在同一个存储器中，计算机能够修改自己的程序。这一架构不仅提高了计算机的灵活性，更为AI的发展提供了重要的理论基础。冯·诺依曼架构的核心思想是将程序视为数据，这使得计算机不仅能够处理数据，还能够处理处理数据的规则。这种自指性（self-reference）为后来的AI研究，特别是机器学习和自适应系统的发展，提供了重要的启示。正是这种能够&quot;自我修改&quot;的特性，使得机器具备了学习和进化的可能性。冯·诺依曼本人也是AI理论的重要贡献者，他在《计算机与人脑》一书中比较了计算机和人脑的工作原理，提出了许多关于机器智能的深刻见解，为后来的AI研究提供了重要的理论指导。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/sum \\bf 莱布尼兹}（Gottfried Wilhelm Leibniz）进一步改进了帕斯卡的设计，发明了能够执行十进制数乘除运算的机械计算机，揭示了机械计算在复杂运算中的巨大潜力。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">随着时间的推移，机械计算设备逐渐变得更为复杂和精密。1642年，法国数学家{\\bf 布莱兹·帕斯卡}（Blaise Pascal）发明了第一台机械计算器---“帕斯卡计算器”，它可以执行十进制加法运算，标志着机械与数学计算结合的开端。\n1678年，德国数学家{\\bf 莱布尼兹}（Gottfried Wilhelm Leibniz）进一步改进了帕斯卡的设计，发明了能够执行十进制数乘除运算的机械计算机，揭示了机械计算在复杂运算中的巨大潜力。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-33\" data-status=\"added\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-added\">新增<\/span>\n      <strong>pair-0035<\/strong>\n      <span class=\"meta\">paragraph · L33-L42<\/span>\n    <\/div>\n    <div class=\"section-title\">AI的萌芽期：理论的起源与计算机的诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>不仅是机械计算工具，自动化的思想也融入了各类生产工具的设计中。19世纪，{\\bf 雅卡尔织机}通过打孔卡片来控制织物图案的变化，展示了早期的编程思想。这种通过机械手段实现将繁复的任务自动化的理念，预示着计算机自动化编程的雏形，间接推动了后来智能技术的发展。\n19世纪，随着工业革命的推进，人类对计算的需求愈加迫切，特别是在天文学、工程学和金融领域。大量数字和复杂方程式问题已远超出人类的手工能力，催生了更多计算机器的发明。\n1821年，英国数学家{\\bf 查尔斯·巴贝奇}（Charles Babbage）设计了“差分机”，这是一种专门用于提高乘法速度和改进对数表精度的机械计算装置。尽管由于设计成本过高，差分机的后续发展以失败告终，但巴贝奇在1834年设计的“分析机”被认为是通用计算机的雏形，通过打孔纸带输入程序和数据，预示了现代计算机的基本理念。尽管“分析机”最终因技术局限也未能实现，但巴贝奇的思想奠定了现代计算机的概念基础：通过程序控制的通用计算机。\n20世纪初，数学家如{\\bf 大卫·希尔伯特}、{\\bf 库尔特·哥德尔}和{\\bf 阿兰·图灵}提出了关于计算与逻辑的基本理论，为人工智能的萌芽提供了肥沃的土壤。\n{\\bf 阿兰·图灵}在1936年发表的《论可计算数》一文中，提出了{\\bf 图灵机}的概念，奠定了现代计算理论的基础和框架。图灵机是一种模拟计算过程的抽象数学模型，这一思想不仅为后来电子计算机的发明打下了坚实的理论基础，也为人工智能提出了一个关键问题---{\\bf 机器能否像人类一样思考？} 1950年，图灵提出了了著名的{\\bf 图灵测试}，作为判断机器是否具备智能的标准，开启了对机器智能的早期探索。\n图灵的思想对随后的人工智能发展产生了深远的影响，确定了未来人工智能的发展方向。\n20世纪，电子技术的突破使计算机摆脱了传统机械部件的限制，转向实用电子开关、电路板和真空管，使计算速度提高了无数倍，实现了前所未有的效率飞跃。\n真正具有突破性的发明出现在1942年，美国的{\\bf 约翰·阿塔纳索夫}（John Vincent Atanasoff）和{\\bf 克利福德·贝瑞}（Clifford Berry）制造了第一台电子计算机---{\\bf Atanasoff-Berry计算机（ABC）}，首次使用二进制来表示数据，并通过电子开关代替了机械部件，标志着从机械计算向电子计算的重大转变，尽管它尚无法进行编程。\n随后，{\\bf ENIAC}，由{\\bf 约翰·冯·诺依曼}（John von Neumann）等人设计，成为世界上第一台通用电子计算机。ENIAC不仅能进行复杂的计算，还采用了冯·诺依曼的存储程序架构，即将程序和数据存储在计算机内存中。这一架构成为现代计算机的基础，大幅提高了计算机的灵活性和计算效率。\n这些电子计算机的发明，不仅标志着计算能力的巨大飞跃，也为人工智能的早期发展提供了关键的技术平台。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">不仅是机械计算工具，自动化的思想也融入了各类生产工具的设计中。19世纪，{\\bf 雅卡尔织机}通过打孔卡片来控制织物图案的变化，展示了早期的编程思想。这种通过机械手段实现将繁复的任务自动化的理念，预示着计算机自动化编程的雏形，间接推动了后来智能技术的发展。\n19世纪，随着工业革命的推进，人类对计算的需求愈加迫切，特别是在天文学、工程学和金融领域。大量数字和复杂方程式问题已远超出人类的手工能力，催生了更多计算机器的发明。\n1821年，英国数学家{\\bf 查尔斯·巴贝奇}（Charles Babbage）设计了“差分机”，这是一种专门用于提高乘法速度和改进对数表精度的机械计算装置。尽管由于设计成本过高，差分机的后续发展以失败告终，但巴贝奇在1834年设计的“分析机”被认为是通用计算机的雏形，通过打孔纸带输入程序和数据，预示了现代计算机的基本理念。尽管“分析机”最终因技术局限也未能实现，但巴贝奇的思想奠定了现代计算机的概念基础：通过程序控制的通用计算机。\n20世纪初，数学家如{\\bf 大卫·希尔伯特}、{\\bf 库尔特·哥德尔}和{\\bf 阿兰·图灵}提出了关于计算与逻辑的基本理论，为人工智能的萌芽提供了肥沃的土壤。\n{\\bf 阿兰·图灵}在1936年发表的《论可计算数》一文中，提出了{\\bf 图灵机}的概念，奠定了现代计算理论的基础和框架。图灵机是一种模拟计算过程的抽象数学模型，这一思想不仅为后来电子计算机的发明打下了坚实的理论基础，也为人工智能提出了一个关键问题---{\\bf 机器能否像人类一样思考？} 1950年，图灵提出了了著名的{\\bf 图灵测试}，作为判断机器是否具备智能的标准，开启了对机器智能的早期探索。\n图灵的思想对随后的人工智能发展产生了深远的影响，确定了未来人工智能的发展方向。\n20世纪，电子技术的突破使计算机摆脱了传统机械部件的限制，转向实用电子开关、电路板和真空管，使计算速度提高了无数倍，实现了前所未有的效率飞跃。\n真正具有突破性的发明出现在1942年，美国的{\\bf 约翰·阿塔纳索夫}（John Vincent Atanasoff）和{\\bf 克利福德·贝瑞}（Clifford Berry）制造了第一台电子计算机---{\\bf Atanasoff-Berry计算机（ABC）}，首次使用二进制来表示数据，并通过电子开关代替了机械部件，标志着从机械计算向电子计算的重大转变，尽管它尚无法进行编程。\n随后，{\\bf ENIAC}，由{\\bf 约翰·冯·诺依曼}（John von Neumann）等人设计，成为世界上第一台通用电子计算机。ENIAC不仅能进行复杂的计算，还采用了冯·诺依曼的存储程序架构，即将程序和数据存储在计算机内存中。这一架构成为现代计算机的基础，大幅提高了计算机的灵活性和计算效率。\n这些电子计算机的发明，不仅标志着计算能力的巨大飞跃，也为人工智能的早期发展提供了关键的技术平台。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-44\" data-status=\"added\">\n  <div class= 「存储程序」的概念，这使得计算机能够按照程序指令自动执行复杂任务。冯·诺依曼的计算机架构为人工智能提供了强大的硬件基础，也为智能程序的实现铺平了道路。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">1950到1970年代，人工智能开始从理论走向实践。1950年代被视为人工智能的正式起点。在此期间，数学、逻辑学、计算机科学和神经科学的交汇，为人工智能的早期发展铺设了道路。\n{\\bf 阿兰·图灵}的贡献无疑就是这个时期最为重要的起点。1950年，他在论文《计算机器与智能》中提出了衡量机器是否具备智能的标准---「图灵测试」。图灵通过设想一台机器与人类对话的情境，开启了对机器是否能够模拟人类智能的讨论，奠定了早期人工智能研究的理论基础。\n{\\bf 约翰·冯·诺依曼}的工作对AI的发展也产生了重要影响。1940年代，冯·诺依曼提出了自复制自动机的理论，并在计算机设计中推广了「存储程序」的概念，这使得计算机能够按照程序指令自动执行复杂任务。冯·诺依曼的计算机架构为人工智能提供了强大的硬件基础，也为智能程序的实现铺平了道路。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-unchanged\" id=\"line-87\" data-status=\"unchanged\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-unchanged\">未变化<\/span>\n      <strong>pair-0047<\/strong>\n      <span class=\"meta\">section · 原文 L87 / 修改后 L54<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>\\subsection{达特茅斯会议：AI学科的正式诞生}<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>\\subsection{达特茅斯会议：AI学科的正式诞生}<\/code><\/pre>\n    <\/section>\n  <\/div>\n  \n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-89\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0048<\/strong>\n      <span class=\"meta\">paragraph · L89<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>1956年夏天，在美国达特茅斯学院举行的一次学术会议被公认为AI学科的诞生标志。这次为期两个月的会议由约翰·麦卡锡、马文·明斯基、克劳德·香农、艾伦·纽厄尔、赫伯特·西蒙和纳撒尼尔·罗切斯特等人组织，首次使用了&quot;人工智能&quot;这一术语，正式确立了AI作为一个独立学科的地位。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">1956年夏天，在美国达特茅斯学院举行的一次学术会议被公认为AI学科的诞生标志。这次为期两个月的会议由约翰·麦卡锡、马文·明斯基、克劳德·香农、艾伦·纽厄尔、赫伯特·西蒙和纳撒尼尔·罗切斯特等人组织，首次使用了&quot;人工智能&quot;这一术语，正式确立了AI作为一个独立学科的地位。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-91\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0049<\/strong>\n      <span class=\"meta\">paragraph · L91<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>达特茅斯会议的召开体现了20世纪50年代科学技术发展的必然性。二战后，计算机技术快速发展，控制论、信息论等新兴学科兴起，为AI研究创造了良好的条件。同时，一批杰出的科学家开始思考机器智能的可能性，迫切需要一个平台来交流思想、整合资源。会议的组织者们在申请书中写道：&quot;我们提议在1956年夏天在新罕布什尔州汉诺威的达特茅斯学院进行一项关于人工智能的2个月、10人的研究。研究将基于这样的猜想：学习的每一个方面或者智能的任何其他特征都应该能够被精确地描述，使得机器能够对其进行模拟。&quot;这段话清晰地表达了早期AI研究者的核心理念和雄心壮志。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">达特茅斯会议的召开体现了20世纪50年代科学技术发展的必然性。二战后，计算机技术快速发展，控制论、信息论等新兴学科兴起，为AI研究创造了良好的条件。同时，一批杰出的科学家开始思考机器智能的可能性，迫切需要一个平台来交流思想、整合资源。会议的组织者们在申请书中写道：&quot;我们提议在1956年夏天在新罕布什尔州汉诺威的达特茅斯学院进行一项关于人工智能的2个月、10人的研究。研究将基于这样的猜想：学习的每一个方面或者智能的任何其他特征都应该能够被精确地描述，使得机器能够对其进行模拟。&quot;这段话清晰地表达了早期AI研究者的核心理念和雄心壮志。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-93\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0050<\/strong>\n      <span class=\"meta\">paragraph · L93<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>会议汇聚的学者群体及其贡献奠定了AI研究的多元化基础。约翰·麦卡锡不仅创造了&quot;人工智能&quot;这一术语，还发明了LISP编程语言，提出了&quot;常识推理&quot;和&quot;情境演算&quot;等重要概念。马文·明斯基在感知器理论和知识表示方面做出了重要贡献，他的《心智社会》提出了心智是由许多简单智能体组成的复杂系统的观点。克劳德·香农作为信息论的创始人，为AI中的信息处理提供了数学基础，他设计的国际象棋程序为后来的博弈AI奠定了基础。艾伦·纽厄尔和赫伯特·西蒙共同开发了逻辑理论机，提出了&quot;物理符号系统假设&quot;，成为符号主义AI的理论基础。纳撒尼尔·罗切斯特在神经网络和机器学习方面做出了早期贡献，为联结主义AI研究奠定了基础。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">会议汇聚的学者群体及其贡献奠定了AI研究的多元化基础。约翰·麦卡锡不仅创造了&quot;人工智能&quot;这一术语，还发明了LISP编程语言，提出了&quot;常识推理&quot;和&quot;情境演算&quot;等重要概念。马文·明斯基在感知器理论和知识表示方面做出了重要贡献，他的《心智社会》提出了心智是由许多简单智能体组成的复杂系统的观点。克劳德·香农作为信息论的创始人，为AI中的信息处理提供了数学基础，他设计的国际象棋程序为后来的博弈AI奠定了基础。艾伦·纽厄尔和赫伯特·西蒙共同开发了逻辑理论机，提出了&quot;物理符号系统假设&quot;，成为符号主义AI的理论基础。纳撒尼尔·罗切斯特在神经网络和机器学习方面做出了早期贡献，为联结主义AI研究奠定了基础。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-95\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0051<\/strong>\n      <span class=\"meta\">paragraph · L95<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>达特茅斯会议的历史意义远远超出了一次学术聚会的范畴。首先，会议确立了AI研究的基本目标：通过计算机程序来模拟人类智能，为AI研究提供了清晰的方向。其次，会议体现了早期AI研究者的乐观主义精神，他们相信机器能够实现与人类相当甚至超越人类的智能，这种乐观主义推动了AI研究的快速发展。第三，会议建立了AI研究的跨学科传统，参会者来自数学、计算机科学、心理学、神经科学等不同领域，为AI研究注入了丰富的思想资源。最后，会议确立了AI研究的基本方法论：通过构建实际的计算机程序来验证理论假设，强调理论与实践的结合。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">达特茅斯会议的历史意义远远超出了一次学术聚会的范畴。首先，会议确立了AI研究的基本目标：通过计算机程序来模拟人类智能，为AI研究提供了清晰的方向。其次，会议体现了早期AI研究者的乐观主义精神，他们相信机器能够实现与人类相当甚至超越人类的智能，这种乐观主义推动了AI研究的快速发展。第三，会议建立了AI研究的跨学科传统，参会者来自数学、计算机科学、心理学、神经科学等不同领域，为AI研究注入了丰富的思想资源。最后，会议确立了AI研究的基本方法论：通过构建实际的计算机程序来验证理论假设，强调理论与实践的结合。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-56\" data-status=\"added\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-added\">新增<\/span>\n      <strong>pair-0052<\/strong>\n      <span class=\"meta\">paragraph · L56-L59<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>{\\bf 约翰·麦卡锡}（John McCarthy）是AI奠基时期最关键的人物之一。他的思想和研究引领了AI这一全新领域的诞生和早期发展。\n1948年，年轻的麦卡锡在普林斯顿大学听了{\\bf 冯·诺依曼}关于自复制自动机的报告后，激发了他对“用计算机模拟人类智能”的强烈兴趣。1949年，麦卡锡在普林斯顿数学系攻读博士学位时首次在论文中提出了“用计算机来模拟人类智能”的想法，尽管当时这一概念十分模糊，但已表现出AI作为独立研究领域的雏形。在冯·诺依曼的鼓励和支持下，麦卡锡将主要研究方向定为在机器上模拟人的智能，特别是将下棋问题作为重点课题之一。此后，为了减少计算机需要考虑的棋步，麦卡锡发明了α-β剪枝算法。这一方法有效地减少了计算量，至今仍是解决人工智能问题中一种常用的高效方法。\n麦卡锡和贝尔实验室的{\\bf 克劳德·香农}（Claude Shannon）---“信息论”的创始人，在人工智能方面的若干深入探讨之后，他们萌生召开一次研讨会的共识。1956年，在洛克菲勒基金会的一笔微薄的赞助下，他们邀请到当时哈佛大学的{\\bf 马文·明斯基}（Marvin Minsky）和IBM工程师罗彻斯特等几位学者，在达特茅斯学院组织了这次夏季研讨会。\n在达特茅斯会议上，“{\\bf 人工智能}”一词降临，备选名字有“{\\bf 自动机研究}”、“{\\bf 复杂信息处理}”、“{\\bf 机器智能}”与“{\\bf 控制论}”，与会者最终选择了“人工智能”（Artificial Intelligence），简洁而富有指向性。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">{\\bf 约翰·麦卡锡}（John McCarthy）是AI奠基时期最关键的人物之一。他的思想和研究引领了AI这一全新领域的诞生和早期发展。\n1948年，年轻的麦卡锡在普林斯顿大学听了{\\bf 冯·诺依曼}关于自复制自动机的报告后，激发了他对“用计算机模拟人类智能”的强烈兴趣。1949年，麦卡锡在普林斯顿数学系攻读博士学位时首次在论文中提出了“用计算机来模拟人类智能”的想法，尽管当时这一概念十分模糊，但已表现出AI作为独立研究领域的雏形。在冯·诺依曼的鼓励和支持下，麦卡锡将主要研究方向定为在机器上模拟人的智能，特别是将下棋问题作为重点课题之一。此后，为了减少计算机需要考虑的棋步，麦卡锡发明了α-β剪枝算法。这一方法有效地减少了计算量，至今仍是解决人工智能问题中一种常用的高效方法。\n麦卡锡和贝尔实验室的{\\bf 克劳德·香农}（Claude Shannon）---“信息论”的创始人，在人工智能方面的若干深入探讨之后，他们萌生召开一次研讨会的共识。1956年，在洛克菲勒基金会的一笔微薄的赞助下，他们邀请到当时哈佛大学的{\\bf 马文·明斯基}（Marvin Minsky）和IBM工程师罗彻斯特等几位学者，在达特茅斯学院组织了这次夏季研讨会。\n在达特茅斯会议上，“{\\bf 人工智能}”一词降临，备选名字有“{\\bf 自动机研究}”、“{\\bf 复杂信息处理}”、“{\\bf 机器智能}”与“{\\bf 控制论}”，与会者最终选择了“人工智能”（Artificial Intelligence），简洁而富有指向性。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-60\" data-status=\"added\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-added\">新增<\/span>\n      <strong>pair-0053<\/strong>\n      <span class=\"meta\">comment · L60<\/span>\n    <\/div>\n    <div class=\"section-title\">达特茅斯会议：AI学科的正式诞生<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>%并希望通过计算机来模拟人类的智能行为。与会的其他科学家，如{\\bf 马文·明斯基（Marvin Minsky）}和{\\bf 赫伯特·西蒙（Herbert Simon）}，则为人工智能的发展注入了心理学和认知科学的思考。他们在会议中提出，智能行为可以被机器模仿，机器能够学习和推理。<\/code><\/pre>\n A能够与用户进行简单的对话，模拟心理治疗师的行为。ELIZA的工作原理相对简单，主要基于模式匹配和模板替换。程序预设了一系列对话模板，当用户输入文本时，ELIZA会寻找匹配的模式，然后根据模板生成回应。例如，当用户说&quot;我感到沮丧&quot;时，ELIZA可能会回应&quot;你为什么感到沮丧？&quot;这种简单的技术却产生了令人惊讶的效果。ELIZA的成功展示了机器处理自然语言的可能性，但更重要的是，它揭示了人类对机器智能的心理期待。许多用户在与ELIZA对话时表现出强烈的情感投入，甚至相信ELIZA真的理解他们的感受。这种现象被称为&quot;ELIZA效应&quot;，它提醒我们，人类很容易将智能归因于表现出智能行为的系统，即使这种行为可能是通过简单的规则产生的。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">ELIZA是这一时期最著名的自然语言处理程序之一，也是第一个引起公众广泛关注的AI系统。由约瑟夫·魏岑鲍姆（Joseph Weizenbaum）在MIT开发的ELIZA能够与用户进行简单的对话，模拟心理治疗师的行为。ELIZA的工作原理相对简单，主要基于模式匹配和模板替换。程序预设了一系列对话模板，当用户输入文本时，ELIZA会寻找匹配的模式，然后根据模板生成回应。例如，当用户说&quot;我感到沮丧&quot;时，ELIZA可能会回应&quot;你为什么感到沮丧？&quot;这种简单的技术却产生了令人惊讶的效果。ELIZA的成功展示了机器处理自然语言的可能性，但更重要的是，它揭示了人类对机器智能的心理期待。许多用户在与ELIZA对话时表现出强烈的情感投入，甚至相信ELIZA真的理解他们的感受。这种现象被称为&quot;ELIZA效应&quot;，它提醒我们，人类很容易将智能归因于表现出智能行为的系统，即使这种行为可能是通过简单的规则产生的。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-117\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0068<\/strong>\n      <span class=\"meta\">paragraph · L117<\/span>\n    <\/div>\n    <div class=\"section-title\">符号主义AI的黄金时代<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>SHRDLU是另一个重要的自然语言处理系统，由特里·维诺格拉德（Terry Winograd）在MIT开发。与ELIZA不同，SHRDLU能够理解关于积木世界的自然语言指令，并在虚拟环境中执行相应的操作。用户可以用自然语言告诉SHRDLU&quot;把红色的积木放在蓝色的积木上面&quot;，SHRDLU会理解这个指令并执行相应的动作。SHRDLU的成功在于它将自然语言理解与问题求解相结合，展示了AI系统处理复杂任务的能力。然而，SHRDLU的局限性也很明显：它只能在非常受限的积木世界中工作，无法处理现实世界的复杂性。这一局限性预示了符号主义AI面临的根本挑战，即如何从受控环境扩展到开放世界。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">SHRDLU是另一个重要的自然语言处理系统，由特里·维诺格拉德（Terry Winograd）在MIT开发。与ELIZA不同，SHRDLU能够理解关于积木世界的自然语言指令，并在虚拟环境中执行相应的操作。用户可以用自然语言告诉SHRDLU&quot;把红色的积木放在蓝色的积木上面&quot;，SHRDLU会理解这个指令并执行相应的动作。SHRDLU的成功在于它将自然语言理解与问题求解相结合，展示了AI系统处理复杂任务的能力。然而，SHRDLU的局限性也很明显：它只能在非常受限的积木世界中工作，无法处理现实世界的复杂性。这一局限性预示了符号主义AI面临的根本挑战，即如何从受控环境扩展到开放世界。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-119\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0069<\/strong>\n      <span class=\"meta\">paragraph · L119<\/span>\n    <\/div>\n    <div class=\"section-title\">符号主义AI的黄金时代<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>虽然这一时期的AI研究主要集中在符号推理上，但机器学习的思想也开始萌芽。研究者逐渐意识到，手工编程所有的知识和规则是不现实的，机器必须具备自我学习的能力。感知器（Perceptron）是最早的学习算法之一，由弗兰克·罗森布拉特（Frank Rosenblatt）在1957年提出。感知器是一个简单的神经网络模型，能够通过训练来学习线性分类任务。罗森布拉特证明了感知器学习算法的收敛性：对于线性可分的问题，感知器算法总能在有限步内找到正确的分类边界。感知器的成功激发了人们对神经网络和机器学习的兴趣，为后来的联结主义AI发展奠定了基础。然而，马文·明斯基和西摩·帕普特在1969年发表的《感知器》一书指出了单层感知器的局限性，特别是无法解决非线性可分问题（如异或问题），这一批评在很大程度上抑制了神经网络研究的发展。\\<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">虽然这一时期的AI研究主要集中在符号推理上，但机器学习的思想也开始萌芽。研究者逐渐意识到，手工编程所有的知识和规则是不现实的，机器必须具备自我学习的能力。感知器（Perceptron）是最早的学习算法之一，由弗兰克·罗森布拉特（Frank Rosenblatt）在1957年提出。感知器是一个简单的神经网络模型，能够通过训练来学习线性分类任务。罗森布拉特证明了感 ff-inline\"><span class=\"diff-token is-delete\">早期AI研究者很快意识到，手工编程所有的知识和规则是不现实的，机器必须具备自我学习的能力。这一认识推动了早期机器学习研究的发展，虽然当时的技术还很原始，但它们为后来的发展奠定了基础。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-125\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0072<\/strong>\n      <span class=\"meta\">paragraph · L125<\/span>\n    <\/div>\n    <div class=\"section-title\">自我学习的探索<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>概念学习是早期机器学习的重要研究方向。研究者试图开发能够从例子中学习概念的算法，这种学习方式更接近人类的认知过程。帕特里克·温斯顿（Patrick Winston）的积木学习程序是概念学习的典型例子。这个程序能够从正例和反例中学习&quot;拱门&quot;等概念。程序通过分析正例的共同特征和反例的差异，逐步形成对概念的理解。例如，通过观察多个拱门的例子，程序学会了拱门必须由两个支柱和一个横梁组成，支柱必须支撑横梁等规则。概念学习的研究揭示了学习过程的复杂性。即使是看似简单的概念，如&quot;拱门&quot;，也涉及复杂的结构关系和约束条件。这种复杂性使得概念学习算法往往只能在非常受限的领域中工作，难以扩展到现实世界的复杂概念。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">概念学习是早期机器学习的重要研究方向。研究者试图开发能够从例子中学习概念的算法，这种学习方式更接近人类的认知过程。帕特里克·温斯顿（Patrick Winston）的积木学习程序是概念学习的典型例子。这个程序能够从正例和反例中学习&quot;拱门&quot;等概念。程序通过分析正例的共同特征和反例的差异，逐步形成对概念的理解。例如，通过观察多个拱门的例子，程序学会了拱门必须由两个支柱和一个横梁组成，支柱必须支撑横梁等规则。概念学习的研究揭示了学习过程的复杂性。即使是看似简单的概念，如&quot;拱门&quot;，也涉及复杂的结构关系和约束条件。这种复杂性使得概念学习算法往往只能在非常受限的领域中工作，难以扩展到现实世界的复杂概念。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-127\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0073<\/strong>\n      <span class=\"meta\">paragraph · L127<\/span>\n    <\/div>\n    <div class=\"section-title\">自我学习的探索<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>归纳推理是另一个重要的学习机制。与演绎推理从一般到特殊不同，归纳推理从特殊到一般，能够从具体的观察中得出一般性的规律。这种推理方式对于机器学习具有重要意义，因为它允许机器从有限的经验中获得可泛化的知识。早期的归纳学习算法主要基于符号表示，试图从训练例子中归纳出逻辑规则。例如，给定一系列关于动物的事实（如&quot;鸟会飞&quot;、&quot;企鹅是鸟&quot;、&quot;企鹅不会飞&quot;），归纳学习算法试图发现一般性的规则（如&quot;鸟会飞，除非它是企鹅&quot;）。归纳推理的研究揭示了学习中的一个根本问题：归纳偏置（inductive bias）。由于从有限的例子中可以归纳出无穷多个可能的规律，学习算法必须具有某种偏置来选择最合适的规律。这种偏置可能来自先验知识、简单性原则或其他启发式方法。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">归纳推理是另一个重要的学习机制。与演绎推理从一般到特殊不同，归纳推理从特殊到一般，能够从具体的观察中得出一般性的规律。这种推理方式对于机器学习具有重要意义，因为它允许机器从有限的经验中获得可泛化的知识。早期的归纳学习算法主要基于符号表示，试图从训练例子中归纳出逻辑规则。例如，给定一系列关于动物的事实（如&quot;鸟会飞&quot;、&quot;企鹅是鸟&quot;、&quot;企鹅不会飞&quot;），归纳学习算法试图发现一般性的规则（如&quot;鸟会飞，除非它是企鹅&quot;）。归纳推理的研究揭示了学习中的一个根本问题：归纳偏置（inductive bias）。由于从有限的例子中可以归纳出无穷多个可能的规律，学习算法必须具有某种偏置来选择最合适的规律。这种偏置可能来自先验知识、简单性原则或其他启发式方法。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-129\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0074<\/strong>\n      <span class=\"meta\">paragraph · L129<\/span>\n    <\/div>\n    <div class=\"section-title\">自我学习的探索<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>早期机器学习研究的另一个重要贡献是对学习理论基础的探索。研究者开始思考什么样的问题是可学习的，需要多少训练数据才能保证学习的成功，以及如何评估学习算法的性能。这些理论问题的探讨为后来的统计学习理论和计算学习理论奠定了基础。虽然早期的机器学习算法在实际应用中的成功有限，但它们提出的核心思想——从数据中自动获取知识——成为现代AI发展的重要驱动力。这一时期的研究表明，机器学习不仅是一个技术问题，更是一个涉及认知科学、统计学、计算理论等多个领域的跨学科问题。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">早期机器学习研究的另一个重要贡献是对学习理论基础的探索。研究者开始思考什么样的问题是可学习的，需要多少训练数据才能保证学习的成功，以及如何评估学习算法的性能。这些理论问题的探讨为后来的统计学习理论和计算学习理论奠定了基础。虽然早期的机器学习算法在实际应用中的成功有限，但它们提出的核心思想——从数据中自动获取知识——成为现代AI发展的重要驱动力。这一时期的研究表明，机器学习不仅是一个技术问题，更是一个涉及认知科学、统计学、计算理论等多个领域的跨学科问题。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-131\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0075<\/strong>\n      <span class=\"meta\">section · L131<\/span>\n    <\/div>\n    <div class=\"section-title\">第一次&quot;AI寒冬&quot;的到来<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>\\subsection{第一次&quot;AI寒冬&quot;的到来}<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">\\subsection{第一次&quot;AI寒冬&quot;的到来}<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-133\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0076<\/strong>\n      <span class=\"meta\">paragraph · L133<\/span>\n    <\/div>\n    <div class=\"section-title\">第一次&quot;AI寒冬&quot;的到来<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>1970年代初，AI研究遭遇了第一次重大挫折，被称为&quot;AI寒冬&quot;。这次挫折的原因是多方面的，既有技术上的限制，也有对AI能力的过高期望。这次挫折虽然阻碍了AI的发展，但也促使研究者更深入地思考AI的本质和局限性。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">1970年代初，AI研究遭遇了第一次重大挫折，被称为&quot;AI寒冬&quot;。这次挫折的原因是多方面的，既有技术上的限制，也有对AI能力的过高期望。这次挫折虽然阻碍了AI的发展，但也促使研究者更深入地思考AI的本质和局限性。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-135\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0077<\/strong>\n      <span class=\"meta\">paragraph · L135<\/span>\n    <\/div>\n    <div class=\"section-title\">第一次&quot;AI寒冬&quot;的到来<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>随着问题规模的增大，AI系统面临着计算复杂性的严重挑战。许多看似简单的问题，如机器翻译和图像识别，实际上具有极高的计算复杂度，当时的计算机硬件无法支持这些复杂的计算需求。机器翻译是一个典型的例子，早期的研究者认为只需要建立词汇对应关系和语法转换规则就能实现，然而实际的翻译过程涉及语义理解、上下文分析、文化背景等复杂因素，远比预期的复杂。1966年美国科学院发布的ALPAC报告指出，机器翻译的质量远低于人工翻译，投入产出比不合理，导致政府大幅削减了机器翻译的研究资金。图像识别也面临类似的挑战，虽然人类能够轻松识别图像中的物体，但让机器做到这一点却极其困难，涉及特征提取、模式匹配、上下文理解等多个层次的处理，每个层次都有巨大的计算复杂度，当时的算法和硬件都无法处理这种复杂性。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">随着问题规模的增大，AI系统面临着计算复杂性的严重挑战。许多看似简单的问题，如机器翻译和图像识别，实际上具有极高的计算复杂度，当时的计算机硬件无法支持这些复杂的计算需求。机器翻译是一个典型的例子，早期的研究者认为只需要建立词汇对应关系和语法转换规则就能实现，然而实际的翻译过 atica）中的38个定理，其中一个定理的证明甚至比原书更加简洁，这一成功极大地鼓舞了AI研究者的信心，证明了机器确实能够进行复杂的逻辑推理。逻辑理论机的工作原理体现了符号主义AI的核心思想：将问题表示为符号结构，通过符号操作来求解问题，程序使用启发式搜索方法，在可能的证明路径中寻找最有希望的方向，这种方法后来成为AI问题求解的基本范式。通用问题求解器（General Problem Solver, GPS）是另一个重要的早期AI系统，GPS试图通过手段-目的分析来解决各种问题，体现了符号主义AI追求通用性的理想，其基本思想是将问题表示为初始状态和目标状态，通过一系列操作将初始状态转换为目标状态。虽然GPS在处理简单问题时表现良好，但它很快暴露出局限性，现实世界的问题往往比GPS能够处理的问题复杂得多，需要大量的领域知识和复杂的推理过程，这一局限性促使研究者开始关注知识表示和领域专门化的问题。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">逻辑理论机（Logic Theorist）是符号主义AI的第一个重要成果，也是AI历史上第一个真正意义上的AI程序。由纽厄尔、西蒙和肖（J.C. Shaw）开发的这个程序能够证明《数学原理》（Principia Mathematica）中的38个定理，其中一个定理的证明甚至比原书更加简洁，这一成功极大地鼓舞了AI研究者的信心，证明了机器确实能够进行复杂的逻辑推理。逻辑理论机的工作原理体现了符号主义AI的核心思想：将问题表示为符号结构，通过符号操作来求解问题，程序使用启发式搜索方法，在可能的证明路径中寻找最有希望的方向，这种方法后来成为AI问题求解的基本范式。通用问题求解器（General Problem Solver, GPS）是另一个重要的早期AI系统，GPS试图通过手段-目的分析来解决各种问题，体现了符号主义AI追求通用性的理想，其基本思想是将问题表示为初始状态和目标状态，通过一系列操作将初始状态转换为目标状态。虽然GPS在处理简单问题时表现良好，但它很快暴露出局限性，现实世界的问题往往比GPS能够处理的问题复杂得多，需要大量的领域知识和复杂的推理过程，这一局限性促使研究者开始关注知识表示和领域专门化的问题。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-147\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0083<\/strong>\n      <span class=\"meta\">paragraph · L147<\/span>\n    <\/div>\n    <div class=\"section-title\">符号主义AI的早期发展<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>约翰·麦卡锡发明的LISP（LISt Processing）语言为符号主义AI提供了强大的编程工具，这种语言的设计哲学深刻体现了符号主义AI的核心理念。LISP的核心特征是将程序和数据都表示为列表结构，这种同构性（homoiconicity）使得程序能够操作程序本身，为AI中的自适应和学习提供了可能，在LISP中，一个程序可以生成另一个程序，一个程序可以修改自己的代码，这种灵活性为AI研究提供了前所未有的表达能力。LISP的另一个重要特征是其强大的符号处理能力，与当时主要用于数值计算的FORTRAN等语言不同，LISP专门设计用于处理符号信息，这正是AI研究所需要的，LISP提供了丰富的列表操作函数，使得复杂的符号结构的构造和操作变得简单直观。LISP的函数式编程范式也对AI研究产生了重要影响，函数式编程强调函数的组合和递归，这种编程风格特别适合处理递归定义的符号结构，如语法树、知识图谱等，LISP的这些特性使它成为AI研究的首选语言，直到今天仍在某些AI领域中发挥重要作用。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">约翰·麦卡锡发明的LISP（LISt Processing）语言为符号主义AI提供了强大的编程工具，这种语言的设计哲学深刻体现了符号主义AI的核心理念。LISP的核心特征是将程序和数据都表示为列表结构，这种同构性（homoiconicity）使得程序能够操作程序本身，为AI中的自适应和学习提供了可能，在LISP中，一个程序可以生成另一个程序，一个程序可以修改自己的代码，这种灵活性为AI研究提供了前所未有的表达能力。LISP的另一个重要特征是其强大的符号处理能力，与当时主要用于数值计算的FORTRAN等语言不同，LISP专门设计用于处理符号信息，这正是AI研究所需要的，LISP提供了丰富的列表操作函数，使得复杂的符号结构的构造和操作变得简单直观。LISP的函数式编程范式也对AI研究产生了重要影响，函数式编程强调函数的组合和递归，这种编程风格特别适合处理递归定义的符号结构，如语法树、知识图谱等，LISP的这些特性使它成为AI研究的首选语言，直到今天仍在某些AI领域中发挥重要作用。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-149\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0084<\/strong>\n      <span class=\"meta\">section · L149<\/span>\n    <\/div>\n    <div class=\"section-title\">黄金期与第一次寒冬：理想与现实的碰撞<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>\\section{黄金期与第一次寒冬：理想与现实的碰撞}<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">\\section{黄金期与第一次寒冬：理想与现实的碰撞}<\/span><\/div>\n  <\/details>\n<\/article>\ 简单的规则产生的。SHRDLU是另一个重要的自然语言处理系统，由特里·维诺格拉德（Terry Winograd）在MIT开发，与ELIZA不同，SHRDLU能够理解关于积木世界的自然语言指令，并在虚拟环境中执行相应的操作，用户可以用自然语言告诉SHRDLU&quot;把红色的积木放在蓝色的积木上面&quot;，SHRDLU会理解这个指令并执行相应的动作，SHRDLU的成功在于它将自然语言理解与问题求解相结合，展示了AI系统处理复杂任务的能力，然而，SHRDLU的局限性也很明显：它只能在非常受限的积木世界中工作，无法处理现实世界的复杂性，这一局限性预示了符号主义AI面临的根本挑战。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">ELIZA是这一时期最著名的自然语言处理程序之一，也是第一个引起公众广泛关注的AI系统。由约瑟夫·魏岑鲍姆（Joseph Weizenbaum）在MIT开发的ELIZA能够与用户进行简单的对话，模拟心理治疗师的行为，ELIZA的工作原理相对简单，主要基于模式匹配和模板替换，程序预设了一系列对话模板，当用户输入文本时，ELIZA会寻找匹配的模式，然后根据模板生成回应，例如，当用户说&quot;我感到沮丧&quot;时，ELIZA可能会回应&quot;你为什么感到沮丧？&quot;这种简单的技术却产生了令人惊讶的效果。ELIZA的成功展示了机器处理自然语言的可能性，但更重要的是，它揭示了人类对机器智能的心理期待，许多用户在与ELIZA对话时表现出强烈的情感投入，甚至相信ELIZA真的理解他们的感受，这种现象被称为&quot;ELIZA效应&quot;，它提醒我们，人类很容易将智能归因于表现出智能行为的系统，即使这种行为可能是通过简单的规则产生的。SHRDLU是另一个重要的自然语言处理系统，由特里·维诺格拉德（Terry Winograd）在MIT开发，与ELIZA不同，SHRDLU能够理解关于积木世界的自然语言指令，并在虚拟环境中执行相应的操作，用户可以用自然语言告诉SHRDLU&quot;把红色的积木放在蓝色的积木上面&quot;，SHRDLU会理解这个指令并执行相应的动作，SHRDLU的成功在于它将自然语言理解与问题求解相结合，展示了AI系统处理复杂任务的能力，然而，SHRDLU的局限性也很明显：它只能在非常受限的积木世界中工作，无法处理现实世界的复杂性，这一局限性预示了符号主义AI面临的根本挑战。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-159\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0089<\/strong>\n      <span class=\"meta\">paragraph · L159<\/span>\n    <\/div>\n    <div class=\"section-title\">符号主义AI的黄金时代<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>虽然这一时期的AI研究主要集中在符号推理上，但机器学习的思想也开始萌芽，研究者逐渐意识到，手工编程所有的知识和规则是不现实的，机器必须具备自我学习的能力。感知器（Perceptron）是最早的学习算法之一，由弗兰克·罗森布拉特（Frank Rosenblatt）在1957年提出，感知器是一个简单的神经网络模型，能够通过训练来学习线性分类任务，罗森布拉特证明了感知器学习算法的收敛性：对于线性可分的问题，感知器算法总能在有限步内找到正确的分类边界。感知器的成功激发了人们对神经网络的极大兴趣，许多研究者认为这种方法可能是实现人工智能的关键，然而，这种乐观情绪很快就被现实所打击，1969年，马文·明斯基和西摩·帕普特出版了《感知器》一书，严格证明了单层感知器的局限性，指出它无法解决异或（XOR）等简单的非线性问题，这一批评对神经网络研究产生了深远的负面影响，导致神经网络研究进入了长达十多年的低潮期，直到1980年代多层神经网络和反向传播算法的出现才重新焕发生机。\\<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">虽然这一时期的AI研究主要集中在符号推理上，但机器学习的思想也开始萌芽，研究者逐渐意识到，手工编程所有的知识和规则是不现实的，机器必须具备自我学习的能力。感知器（Perceptron）是最早的学习算法之一，由弗兰克·罗森布拉特（Frank Rosenblatt）在1957年提出，感知器是一个简单的神经网络模型，能够通过训练来学习线性分类任务，罗森布拉特证明了感知器学习算法的收敛性：对于线性可分的问题，感知器算法总能在有限步内找到正确的分类边界。感知器的成功激发了人们对神经网络的极大兴趣，许多研究者认为这种方法可能是实现人工智能的关键，然而，这种乐观情绪很快就被现实所打击，1969年，马文·明斯基和西摩·帕普特出版了《感知器》一书，严格证明了单层感知器的局限性，指出它无法解决异或（XOR）等简单的非线性问题，这一批评对神经网络研究产生了深远的负面影响，导致神经网络研究进入了长达十多年的低潮期，直到1980年代多层神经网络和反向传播算法的出现才重新焕发生机。\\<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-161\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0090<\/strong>\n      <span class=\"meta\">section · L161<\/span>\n    <\/div>\n    <div class=\"section-title\">自我学习的探索<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>\\subsection{自我学习的探索}<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">\\subsection{自我学习的探索}< 转换规则就能实现，然而，实际的翻译过程涉及语义理解、上下文分析、文化背景等复杂因素，远比预期的复杂。1966年，美国科学院发布的ALPAC报告指出，机器翻译的质量远低于人工翻译，投入产出比不合理，导致政府大幅削减了机器翻译的研究资金。图像识别也面临类似的挑战，虽然人类能够轻松识别图像中的物体，但让机器做到这一点却极其困难，图像识别涉及特征提取、模式匹配、上下文理解等多个层次的处理，每个层次都有巨大的计算复杂度，当时的算法和硬件都无法处理这种复杂性。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-delete\">随着问题规模的增大，AI系统面临着计算复杂性的严重挑战。许多看似简单的问题，如机器翻译和图像识别，实际上具有极高的计算复杂度，当时的计算机硬件无法支持这些复杂的计算需求。机器翻译是一个典型的例子，早期的研究者认为，机器翻译只需要建立词汇对应关系和语法转换规则就能实现，然而，实际的翻译过程涉及语义理解、上下文分析、文化背景等复杂因素，远比预期的复杂。1966年，美国科学院发布的ALPAC报告指出，机器翻译的质量远低于人工翻译，投入产出比不合理，导致政府大幅削减了机器翻译的研究资金。图像识别也面临类似的挑战，虽然人类能够轻松识别图像中的物体，但让机器做到这一点却极其困难，图像识别涉及特征提取、模式匹配、上下文理解等多个层次的处理，每个层次都有巨大的计算复杂度，当时的算法和硬件都无法处理这种复杂性。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-removed\" id=\"line-177\" data-status=\"removed\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-removed\">删除<\/span>\n      <strong>pair-0098<\/strong>\n      <span class=\"meta\">paragraph · L177<\/span>\n    <\/div>\n    <div class=\"section-title\">第一次&quot;AI寒冬&quot;的到来<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block\"><code>符号主义AI依赖于精确的知识表示，但现实世界的知识往往是模糊、不完整和矛盾的，如何在计算机中表示这种复杂的知识成为一个难以解决的问题。常识知识的表示是一个特别困难的问题，人类拥有大量的常识知识，如&quot;水往低处流&quot;、&quot;人需要呼吸&quot;等，这些知识看似简单，但要在计算机中精确表示却极其困难，常识知识往往是隐含的、上下文相关的，难以用明确的规则来描述。知识的不一致性也是一个重要问题，现实世界中的知识往往存在例外和矛盾，如&quot;鸟会飞&quot;这个规则有很多例外（企鹅、鸵鸟等），如何在保持知识库一致性的同时处理这些例外，成为知识表示的重要挑战。<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block is-empty\"><code>无修改后文本<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <  寒冬”<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>\\subsection*{1974-1980年代初：第一次“AI 寒冬”}<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">\\subsection*{1974-1980年代初：第一次“AI 寒冬”}<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-115\" data-status=\"added\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-added\">新增<\/span>\n      <strong>pair-0121<\/strong>\n      <span class=\"meta\">paragraph · L115-L120<\/span>\n    <\/div>\n    <div class=\"section-title\">1974-1980年代初：第一次“AI 寒冬”<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>虽然早期的符号AI研究取得了显著进展，但由于研究的持续推进，符号AI的局限性日益显现。尽管符号AI擅长逻辑推理，且在特定任务上表现出色，但在应对现实世界的复杂性和不确定性问题时，特别在处理非结构化数据方面，表现出了明显的不足。\n1965年，机器定理证明领域遇到了瓶颈。例如，计算机推了数十万步也无法证明“两个连续函数之和仍是连续函数”。萨缪尔的跳棋程序停留在了州冠军的水准\n能，难以突破。\n更糟糕的问题出现在{\\bf 机器翻译}领域，计算机在自然语言理解与翻译中表现的极其差劲。例如，翻译程序将英语句子“The spirit is willing but the flesh is weak.”（心有余而力不足）翻译成俄语，再回译成英语时，得到的句子竟变成了“The wine is good but the meet is spoiled.”（酒是好的，肉变质了）。这种笑话般的错误凸显出符号AI在处理语言模糊性方面的无力。\n1970年代的乐观情绪（如通用智能）推动了大量AI项目的启动，然而，随着这些项目未能达最初的预期，尤其是应对现实世界的复杂性方面暴露出显著局限，加上计算资源需求高，导致了随后1974年开始的第一次“AI寒冬”---投资者和政府机构对AI研究的资金支持大幅削减，研究热情和社会关注下降， 许多AI项目被取消，研究活动在1974年至1980年间大幅缩减，AI研究陷入低谷期。\n尽管如此，低谷期的AI领域并非全无进展，反而通过知识工程和专家系统的兴起找到了新的突破口。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"di h · L123-L125<\/span>\n    <\/div>\n    <div class=\"section-title\">专家系统与知识工程的兴起（1980-1987年）<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>从1980年至1987年，AI研究进入了一个新的阶段，以{\\bf 专家系统}和{\\bf 知识工程}的兴起为代表。\n美国计算机科学爱德华•费根鲍姆指出，传统的人工智能过于强调通用求解方法的作用，忽略了具体的领域知识。因此，他提出了基于知识的专家系统。\n{\\bf 知识工程}是利用人工智能技术来构建专家系统的一种方法。{\\bf 专家系统}是基于符号逻辑的AI系统，通过将专家的知识编码为计算规则，帮助机器在特定领域中进行推理和决策，模仿领域专家解决问题的过程。<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">从1980年至1987年，AI研究进入了一个新的阶段，以{\\bf 专家系统}和{\\bf 知识工程}的兴起为代表。\n美国计算机科学爱德华•费根鲍姆指出，传统的人工智能过于强调通用求解方法的作用，忽略了具体的领域知识。因此，他提出了基于知识的专家系统。\n{\\bf 知识工程}是利用人工智能技术来构建专家系统的一种方法。{\\bf 专家系统}是基于符号逻辑的AI系统，通过将专家的知识编码为计算规则，帮助机器在特定领域中进行推理和决策，模仿领域专家解决问题的过程。<\/span><\/div>\n  <\/details>\n<\/article>\n<article class=\"pair-card is-added\" id=\"line-126\" data-status=\"added\">\n  <div class=\"pair-head\">\n    <div>\n      <span class=\"status-badge is-added\">新增<\/span>\n      <strong>pair-0124<\/strong>\n      <span class=\"meta\">section · L126<\/span>\n    <\/div>\n    <div class=\"section-title\">代表性专家系统<\/div>\n  <\/div>\n  <div class=\"compare-grid\">\n    <section class=\"pane\">\n      <div class=\"pane-title\">原文<\/div>\n      <pre class=\"code-block is-empty\"><code>无原文<\/code><\/pre>\n    <\/section>\n    <section class=\"pane\">\n      <div class=\"pane-title\">修改后<\/div>\n      <pre class=\"code-block\"><code>\\subsection{代表性专家系统}<\/code><\/pre>\n    <\/section>\n  <\/div>\n  <details class=\"diff-detail\">\n    <summary>查看词级差异<\/summary>\n    <div class=\"diff-inline\"><span class=\"diff-token is-insert\">\\subsection{代表性专家系统}<\/span><\/div>\n  <\/details>\n<\/ar en;\n        });\n      });\n    });\n  });\n})();\n\n  <\/script>\n<\/body>\n<\/html>\n"</script>
  <script>

(function () {
  const config = JSON.parse(document.getElementById("test-data").textContent);
  const embeddedReviewNode = document.getElementById("review-html");
  const embeddedReviewHtml = embeddedReviewNode ? JSON.parse(embeddedReviewNode.textContent) : "";
  const expected = config.expected || {};
  const frame = document.querySelector("[data-review-frame]");
  const summary = document.querySelector("[data-test-summary]");
  const results = document.querySelector("[data-test-results]");
  const runButton = document.querySelector("[data-run-tests]");
  const sizeButtons = Array.from(document.querySelectorAll("[data-frame-size]"));

  function mark(name, ok, detail) {
    const item = document.createElement("li");
    item.innerHTML = `<div class="status-mark ${ok ? "is-ok" : "is-bad"}">${ok ? "✓" : "×"}</div>
      <div><strong>${escapeHtml(name)}</strong><span>${escapeHtml(detail || "")}</span></div>`;
    results.appendChild(item);
    return ok;
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function readFrameDocument() {
    try {
      return frame.contentDocument || frame.contentWindow.document;
    } catch (error) {
      return null;
    }
  }

  function visibleCards(doc) {
    return Array.from(doc.querySelectorAll("[data-status]")).filter((card) => {
      return !card.classList.contains("is-hidden");
    });
  }

  function countStatuses(cards) {
    return cards.reduce((acc, card) => {
      const status = card.dataset.status || "unknown";
      acc[status] = (acc[status] || 0) + 1;
      return acc;
    }, {});
  }

  function click(doc, selector) {
    const node = doc.querySelector(selector);
    if (!node) {
      return false;
    }
    node.click();
    return true;
  }

  function waitForFrame() {
    return new Promise((resolve) => {
      const doc = readFrameDocument();
      if (doc && doc.readyState === "complete") {
        window.setTimeout(resolve, 30);
        return;
      }
      frame.addEventListener("load", () => window.setTimeout(resolve, 30), { once: true });
      window.setTimeout(resolve, 1500);
    });
  }

  async function runTests() {
    results.innerHTML = "";
    summary.className = "summary-line";
    summary.textContent = "正在测试";
    await waitForFrame();

    const doc = readFrameDocument();
    if (!doc) {
      mark("读取校对页", false, "浏览器限制了 iframe 读取。可在 tools/review/outputs 中运行 python3 -m http.server 后再打开本页。");
      summary.className = "summary-line is-bad";
      summary.textContent = "测试未完成";
      return;
    }

    const cards = Array.from(doc.querySelectorAll("[data-status]"));
    const counts = countStatuses(cards);
    const expectedCounts = expected.statusCounts || {};
    const checks = [];

    checks.push(mark("页面标题", doc.title === expected.title, doc.title));
    checks.push(mark("对照块数量", cards.length === expected.pairCount, `${cards.length} / ${expected.pairCount}`));
    checks.push(mark("已修改数量", (counts.changed || 0) === expectedCounts.changed, `${counts.changed || 0} / ${expectedCounts.changed}`));
    checks.push(mark("新增数量", (counts.added || 0) === expectedCounts.added, `${counts.added || 0} / ${expectedCounts.added}`));
    checks.push(mark("删除数量", (counts.removed || 0) === expectedCounts.removed, `${counts.removed || 0} / ${expectedCounts.removed}`));
    checks.push(mark("未变化数量", (counts.unchanged || 0) === expectedCounts.unchanged, `${counts.unchanged || 0} / ${expectedCounts.unchanged}`));

    const filterButtons = Array.from(doc.querySelectorAll("[data-filter-status]")).map((button) => button.dataset.filterStatus).join(",");
    checks.push(mark("筛选按钮", filterButtons === "all,changed,added,removed,unchanged", filterButtons || "未找到"));

    const navLinks = Array.from(doc.querySelectorAll(".nav-link"));
    const navTargetsValid = navLinks.every((link) => !!doc.querySelector(link.getAttribute("href") || ""));
    checks.push(mark("章节导航", navLinks.length === expected.navCount && navTargetsValid, `${navLinks.length} 个锚点`));

    checks.push(mark("外部脚本", doc.querySelectorAll("script[src]").length === 0, `${doc.querySelectorAll("script[src]").length} 个外部脚本`));

    for (const status of ["changed", "added", "removed", "unchanged", "all"]) {
      click(doc, `[data-filter-status="${status}"]`);
      const visible = visibleCards(doc).length;
      const expectedVisible = status === "all" ? expected.pairCount : expectedCounts[status];
      checks.push(mark(`筛选：${status}`, visible === expectedVisible, `${visible} / ${expectedVisible}`));
    }

    if ((expectedCounts.changed || 0) > 0) {
      click(doc, '[data-filter-status="changed"]');
      const visible = visibleCards(doc);
      click(doc, '[data-diff-action="expand"]');
      const details = visible.flatMap((card) => Array.from(card.querySelectorAll("details.diff-detail")));
      const opened = details.filter((detail) => detail.open).length;
      click(doc, '[data-diff-action="collapse"]');
      const closed = details.filter((detail) => !detail.open).length;
      checks.push(mark("展开差异", opened === details.length && details.length > 0, `${opened} / ${details.length}`));
      checks.push(mark("收起差异", closed === details.length && details.length > 0, `${closed} / ${details.length}`));
    }

    frame.classList.remove("is-mobile");
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const desktopOverflow = doc.documentElement.scrollWidth > frame.clientWidth + 2;
    checks.push(mark("桌面宽度", !desktopOverflow, desktopOverflow ? "出现横向溢出" : "无横向溢出"));

    frame.classList.add("is-mobile");
    await new Promise((resolve) => requestAnimationFrame(resolve));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const grid = doc.querySelector(".compare-grid");
    const gridDisplay = grid ? frame.contentWindow.getComputedStyle(grid).display : "";
    const mobileOverflow = doc.documentElement.scrollWidth > frame.clientWidth + 2;
    checks.push(mark("移动宽度", gridDisplay === "block" && !mobileOverflow, `布局：${gridDisplay || "未知"}`));

    const passed = checks.filter(Boolean).length;
    const failed = checks.length - passed;
    summary.className = failed === 0 ? "summary-line is-ok" : "summary-line is-bad";
    summary.textContent = failed === 0 ? `通过 ${passed} 项` : `通过 ${passed} 项，失败 ${failed} 项`;
  }

  function loadPreview() {
    frame.addEventListener("load", runTests, { once: true });
    if (embeddedReviewHtml && "srcdoc" in frame) {
      frame.srcdoc = embeddedReviewHtml;
      return;
    }
    const doc = readFrameDocument();
    if (doc && doc.readyState === "complete") {
      runTests();
    }
  }

  runButton.addEventListener("click", runTests);
  sizeButtons.forEach((button) => {
    button.addEventListener("click", () => {
      frame.classList.toggle("is-mobile", button.dataset.frameSize === "mobile");
    });
  });
  loadPreview();
})();

  </script>
